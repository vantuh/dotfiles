onboarding = false

[theme]
name = "catppuccin"

auto_switch = false

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+a"

settings = ""
workspace_picker = "prefix+s"

navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

rename_tab = "prefix+comma"

previous_tab = "shift+left"
next_tab = "shift+right"

focus_pane_left = "alt+left"
focus_pane_right = "alt+right"
focus_pane_up = "alt+up"
focus_pane_down = "alt+down"

split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

[keys.indexed]
tabs = "alt"

[ui]
host_cursor = "native"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = "~/dotfiles/zsh/.local/bin/my-usage-status", interval_seconds = 30, timeout_seconds = 10 },
]

[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "vantuh.my-usage.show"
description = "show codex/kiro/cursor usage"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "vantuh.nvim-cheatsheet.show"
description = "show nvim/lazyvim cheatsheet"

[ui.toast]
delivery = "system"
