# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: "proxy"
startPort: 10001
sendLoadingState: true
globalTTL: 0

macros:
  llama_server: /mnt/c/Users/Ivan/llama-bin/llama-server.exe
  models_dir: C:\\Users\\Ivan\\llama-bin\\models
  common_args: "--host 127.0.0.1 --port ${PORT} --flash-attn on --threads 8 --jinja --parallel 1 --metrics"

models:
  "qwen3.6-27b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.6-27B-UD-IQ3_XXS.gguf
      --ctx-size 100000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Qwen 3.6 27B"
    ttl: 300
    aliases:
      - "qwen3.6-27b-local"

  "qwen3.6-27b-kxl":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.6-27B-UD-Q3_K_XL.gguf
      --ctx-size 54000
      -ngl 99
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Qwen 3.6 27B Q3_K_XL"
    ttl: 300
    aliases:
      - "qwen3.6-27b-kxl-local"

  "gemma-4-12b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/gemma-4-12b-it-Q6_K.gguf
      --ctx-size 200000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      ${common_args}
    name: "Gemma 4 12B"
    ttl: 300
    aliases:
      - "gemma-4-12b-local"

  "omnicoder-9b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/omnicoder-9b-q8_0.gguf
      --ctx-size 200000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      ${common_args}
    name: "OmniCoder 9B"
    ttl: 300
    aliases:
      - "omnicoder-9b-local"

  "gemma-4-26b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 196608
      -ngl 27
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 1024
      --ubatch-size 512
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Gemma 4 26B A4B QAT"
    ttl: 300
    aliases:
      - "gemma-4-26b-local"
