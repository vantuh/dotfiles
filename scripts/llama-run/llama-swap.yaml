# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: "proxy"
startPort: 10001
sendLoadingState: true
globalTTL: 0

macros:
  llama_server: /mnt/c/Users/Ivan/llama-bin/llama-server.exe
  models_dir: C:\\Users\\Ivan\\llama-bin\\models
  common_args: "--host 127.0.0.1 --port ${PORT} --flash-attn on --threads 8 --jinja --parallel 1 --metrics"

models:
  "qwen3.8-27b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --ctx-size 100000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --chat-template-kwargs '{"preserve_thinking":true,"reasoning_effort":"medium"}'
      ${common_args}
    name: "Qwen 3.8 27B"
    ttl: 300
    aliases:
      - "qwen3.8-27b-local"

  "qwen3.8-27b-ridge":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.8-27B-Ridge-3.7bpw.gguf
      --ctx-size 131072
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --no-kv-offload
      --chat-template-kwargs '{"preserve_thinking":true,"reasoning_effort":"medium"}'
      ${common_args}
    name: "Qwen 3.8 27B Ridge"
    ttl: 300
    aliases:
      - "qwen3.8-27b-ridge-local"
