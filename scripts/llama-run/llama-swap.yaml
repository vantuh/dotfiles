# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: "proxy"
startPort: 10001
sendLoadingState: true
globalTTL: 0

macros:
  llama_server: /mnt/c/Users/Ivan/llama-bin/llama-server.exe
  models_dir: C:\\Users\\Ivan\\llama-bin\\models
  common_args: "--host 127.0.0.1 --port ${PORT} --flash-attn on --threads 8 --jinja --parallel 1 --metrics"

models:
  "qwen3.6-27b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.6-27B-UD-IQ3_XXS.gguf
      --ctx-size 100000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Qwen 3.6 27B"
    ttl: 300
    aliases:
      - "qwen3.6-27b-local"

  "qwen3.8-27b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.8-27B-UD-IQ3_XXS.gguf
      --ctx-size 100000
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --chat-template-kwargs '{"preserve_thinking":true,"reasoning_effort":"medium"}'
      ${common_args}
    name: "Qwen 3.8 27B"
    ttl: 300
    aliases:
      - "qwen3.8-27b-local"

  "gemma-4-26b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --ctx-size 196608
      -ngl 27
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 1024
      --ubatch-size 512
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Gemma 4 26B A4B QAT"
    ttl: 300
    aliases:
      - "gemma-4-26b-local"

  "qwythos-9b-v2-mtp":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwythos-9B-v2-MTP-Q6_K.gguf
      --ctx-size 160000
      --spec-type draft-mtp
      --spec-draft-n-max 3
      -ngl 99
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      ${common_args}
    name: "Qwythos 9B v2 MTP"
    ttl: 300
    aliases:
      - "qwythos-9b-v2-mtp-local"
