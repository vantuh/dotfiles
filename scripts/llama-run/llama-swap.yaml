# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: "proxy"
startPort: 10001
sendLoadingState: true
globalTTL: 0

macros:
  llama_server: /mnt/c/Users/Ivan/llama-bin/llama-server.exe
  models_dir: C:\\Users\\Ivan\\llama-bin\\models
  common_args: "--host 127.0.0.1 --port ${PORT} --flash-attn on --threads 8 --jinja --parallel 1 --metrics"

models:
  "qwen3.6-27b":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.6-27B-UD-IQ3_XXS.gguf
      --ctx-size 131072
      -ngl 99
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --chat-template-kwargs '{"preserve_thinking":true}'
      ${common_args}
    name: "Qwen 3.6 27B"
    ttl: 300
    aliases:
      - "qwen3.6-27b-local"

  "qwen3.6-27b-mtp":
    cmd: |
      ${llama_server}
      --model ${models_dir}/Qwen3.6-27B-UD-IQ3_XXS_MTP.gguf
      --ctx-size 98304
      -ngl 99
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 2048
      --ubatch-size 512
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --chat-template-kwargs '{"preserve_thinking":true}'
      --spec-type draft-mtp
      --spec-draft-p-min 0.75
      --spec-draft-n-max 2
      ${common_args}
    name: "Qwen 3.6 27B MTP"
    ttl: 300
    aliases:
      - "qwen3.6-27b-mtp-local"
