gui:
  nerdFontsVersion: "3"
  showFileIcons: true
  sidePanelWidth: 0.222
# Standalone lazygit (Herdr tab `lg`): open files in existing Herdr nvim via herdr-nvim-edit.ts.
# Absolute path: Herdr/lazygit PATH often omits ~/.local/bin.
os:
  edit: "{{ .chezmoi.destDir }}/.local/bin/herdr-nvim-edit.ts {{ `{{filename}}` }}"
  editAtLine: "{{ .chezmoi.destDir }}/.local/bin/herdr-nvim-edit.ts +{{ `{{line}}` }} {{ `{{filename}}` }}"
  editAtLineAndWait: "nvim +{{ `{{line}}` }} {{ `{{filename}}` }}"
  # false = don't suspend lazygit (herdr-nvim-edit.ts is non-blocking). Default vim preset is true.
  editInTerminal: false
# Root-level (not under gui). Backup if something still uses RunSubprocessAndRefresh.
promptToReturnFromSubprocess: false
git:
  diffRenderers:
    - command: delta --side-by-side --line-numbers --paging=never
customCommands:
  - key: "<c-g>"
    context: "files"
    description: "Generate commit message with pi AI"
    command: "{{ .chezmoi.destDir }}/.local/bin/pi-commit-msg > /tmp/pi-commit.txt && nvim /tmp/pi-commit.txt && git commit -F /tmp/pi-commit.txt"
    output: terminal
    loadingText: "Generating commit message..."
services:
  "gitlab.foodtech.team": "gitlab:gitlab.foodtech.team"
