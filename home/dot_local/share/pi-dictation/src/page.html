<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11111b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>диктовка</title>
    <style>
      :root {
        color-scheme: dark;
        --base: #1e1e2e;
        --mantle: #11111b;
        --surface: #313244;
        --text: #cdd6f4;
        --muted: #9399b2;
        --accent: #89b4fa;
        --rec: #f38ba8;
        --ok: #a6e3a1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        background: var(--base);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      h1 { font-size: 17px; font-weight: 600; margin: 0; }
      #state { font-size: 13px; color: var(--muted); }
      #state[data-kind="ok"] { color: var(--ok); }
      #state[data-kind="busy"] { color: var(--accent); }
      #state[data-kind="error"] { color: var(--rec); }
      #mic {
        flex: none;
        width: 148px;
        height: 148px;
        margin: 8px auto 0;
        border: 0;
        border-radius: 50%;
        background: var(--surface);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        display: grid;
        place-content: center;
        gap: 6px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.12s ease, background 0.2s ease;
      }
      #mic:active { transform: scale(0.96); }
      #mic[data-recording="true"] { background: var(--rec); color: #11111b; }
      #mic:disabled { opacity: 0.45; }
      #mic span.icon { font-size: 30px; line-height: 1; }
      #timer { text-align: center; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); }
      #level { height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
      #level > div { height: 100%; width: 0%; background: var(--accent); transition: width 80ms linear; }
      #text {
        flex: 1;
        min-height: 160px;
        resize: none;
        padding: 12px;
        border: 1px solid var(--surface);
        border-radius: 12px;
        background: var(--mantle);
        color: var(--text);
        font: 16px/1.5 inherit;
      }
      #text:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .row { display: flex; gap: 8px; }
      .row button {
        flex: 1;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }
      .row button:active { transform: scale(0.98); }
      .row button:disabled { opacity: 0.4; }
      footer { font-size: 12px; color: var(--muted); text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>диктовка</h1>
      <div id="state" data-kind="busy">перевіряю мак…</div>
    </header>

    <button id="mic" type="button" disabled>
      <span class="icon">🎤</span>
      <span id="mic-label">зачекай</span>
    </button>
    <div id="timer">00:00</div>
    <div id="level"><div></div></div>

    <textarea id="text" placeholder="тут з'явиться текст. говори українською, англійські слова вставляй як є."></textarea>

    <div class="row">
      <button id="copy" type="button" disabled>Копіювати</button>
      <button id="clear" type="button" disabled>Очистити</button>
    </div>
    <footer>аудіо обробляється на твоєму маці — нічого не йде в інтернет</footer>

    <script>
      const SAMPLE_RATE = 16000;
      const mic = document.getElementById("mic");
      const micLabel = document.getElementById("mic-label");
      const state = document.getElementById("state");
      const timerEl = document.getElementById("timer");
      const levelEl = document.querySelector("#level > div");
      const textEl = document.getElementById("text");
      const copyEl = document.getElementById("copy");
      const clearEl = document.getElementById("clear");

      let context = null;
      let stream = null;
      let node = null;
      let source = null;
      let chunks = [];
      let frames = 0;
      let startedAt = 0;
      let tick = null;
      let wakeLock = null;
      let recording = false;
      let busy = false;

      function setState(message, kind = "busy") {
        state.textContent = message;
        state.dataset.kind = kind;
      }

      function setBusy(value) {
        busy = value;
        mic.disabled = value || !streamReady;
        copyEl.disabled = value || !textEl.value.trim();
      }

      let streamReady = false;

      function setRecording(value) {
        recording = value;
        mic.dataset.recording = String(value);
        micLabel.textContent = value ? "зупинити" : "говорити";
        mic.disabled = busy;
      }

      function formatSeconds(seconds) {
        const s = Math.floor(seconds);
        return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }

      function encodeWav(parts, sampleRate) {
        let total = 0;
        for (const part of parts) total += part.length;
        const view = new DataView(new ArrayBuffer(44 + total * 2));
        const ascii = (offset, text) => {
          for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
        };
        ascii(0, "RIFF");
        view.setUint32(4, 36 + total * 2, true);
        ascii(8, "WAVE");
        ascii(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        ascii(36, "data");
        view.setUint32(40, total * 2, true);
        let offset = 44;
        for (const part of parts) {
          for (let i = 0; i < part.length; i++) {
            const sample = Math.max(-1, Math.min(1, part[i]));
            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            offset += 2;
          }
        }
        return new Blob([view.buffer], { type: "audio/wav" });
      }

      async function startRecording() {
        if (recording || busy) return;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (error) {
          setState("немає доступу до мікрофона", "error");
          return;
        }
        context = new AudioContext({ sampleRate: SAMPLE_RATE });
        await context.audioWorklet.addModule("/worklet.js");
        source = context.createMediaStreamSource(stream);
        node = new AudioWorkletNode(context, "tap");
        node.port.onmessage = (event) => {
          const frame = event.data;
          chunks.push(frame);
          frames += frame.length;
          let sum = 0;
          for (let i = 0; i < frame.length; i += 16) sum += frame[i] * frame[i];
          const rms = Math.sqrt(sum / Math.max(1, frame.length / 16));
          levelEl.style.width = Math.min(100, Math.round(rms * 320)) + "%";
        };
        source.connect(node);
        // The worklet only reads its input, so route it to a muted output.
        const silent = context.createGain();
        silent.gain.value = 0;
        node.connect(silent).connect(context.destination);

        chunks = [];
        frames = 0;
        startedAt = Date.now();
        tick = setInterval(() => {
          timerEl.textContent = formatSeconds((Date.now() - startedAt) / 1000);
        }, 200);
        setRecording(true);
        setState("записую…", "busy");
        try {
          wakeLock = await navigator.wakeLock?.request("screen");
        } catch {}
      }

      async function stopRecording() {
        if (!recording) return;
        setRecording(false);
        clearInterval(tick);
        tick = null;
        try {
          node?.port.close();
          source?.disconnect();
          await context?.close();
        } catch {}
        stream?.getTracks().forEach((track) => track.stop());
        context = null;
        stream = null;
        levelEl.style.width = "0%";
        try {
          await wakeLock?.release();
        } catch {}
        wakeLock = null;

        if (frames < SAMPLE_RATE / 4) {
          setState("закоротко — спробуй ще", "error");
          chunks = [];
          return;
        }
        const blob = encodeWav(chunks, SAMPLE_RATE);
        chunks = [];
        timerEl.textContent = formatSeconds(frames / SAMPLE_RATE);
        setBusy(true);
        setState("розпізнаю…", "busy");
        try {
          const response = await fetch("/transcribe", {
            method: "POST",
            headers: { "content-type": "audio/wav" },
            body: blob,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload.error || "HTTP " + response.status);
          const text = (payload.text || "").trim();
          textEl.value = textEl.value ? textEl.value.replace(/\s*$/, " ") + text : text;
          const took = payload.ms ? " (" + (payload.ms / 1000).toFixed(1) + " с)" : "";
          setState(text ? "готово" + took : "нічого не розібрав", text ? "ok" : "error");
        } catch (error) {
          setState(String(error.message || error), "error");
        } finally {
          setBusy(false);
          textEl.dispatchEvent(new Event("input"));
          textEl.focus();
        }
      }

      mic.addEventListener("click", () => (recording ? stopRecording() : startRecording()));

      textEl.addEventListener("input", () => {
        copyEl.disabled = !textEl.value.trim();
        clearEl.disabled = !textEl.value.trim();
      });

      copyEl.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(textEl.value);
          setState("скопійовано", "ok");
        } catch {
          textEl.select();
          setState("виділено — скопіюй вручну", "error");
        }
      });

      clearEl.addEventListener("click", () => {
        textEl.value = "";
        copyEl.disabled = true;
        clearEl.disabled = true;
        setState("готово", "ok");
      });

      async function checkHealth() {
        try {
          const health = await (await fetch("/health")).json();
          if (health.ready) {
            streamReady = true;
            setState("мак готовий", "ok");
            micLabel.textContent = "говорити";
            setBusy(false);
          } else if (health.error) {
            setState("модель не завантажилась", "error");
          } else {
            setState("модель прогрівається…", "busy");
            setTimeout(checkHealth, 2000);
          }
        } catch {
          setState("мак не відповідає", "error");
          setTimeout(checkHealth, 3000);
        }
      }

      checkHealth();
    </script>
  </body>
</html>
