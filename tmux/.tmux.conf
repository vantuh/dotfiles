if-shell 'uname | grep -q Darwin' \
  'set-environment -g PATH "/opt/homebrew/bin:$PATH"'
if-shell 'uname | grep -q Darwin' \
  'set -g default-shell /bin/zsh'

if-shell 'uname | grep -q Linux' \
  'set-environment -g PATH "/home/linuxbrew/.linuxbrew/bin:$PATH"'
if-shell 'uname | grep -q Linux' \
  'set -g default-shell /usr/bin/zsh'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",tmux-256color:Tc"
set -s extended-keys on

set -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'opencode btop'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set -g @dracula-plugins "cwd cpu-usage ram-usage continuum"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override window format to show pane count
setw -g window-status-current-format "#[fg=#f8f8f2]#[bg=#6272a4] #I #W(#{window_panes})#F "
setw -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #I #W(#{window_panes})"