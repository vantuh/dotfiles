if-shell 'uname | grep -q Darwin' 'source-file ~/.tmux/platform-darwin.conf'
if-shell 'uname -r | grep -qi microsoft' 'source-file ~/.tmux/platform-wsl.conf'

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -ga terminal-overrides ",tmux-256color:Tc"
set -s extended-keys on
set -g extended-keys-format csi-u

set -g renumber-windows on

# Navigation: Shift+arrows for windows, Alt+arrows for panes, Alt+number for windows
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Confirm kill with Enter (default is y)
bind-key x confirm-before -p "kill-pane #P? (y/Enter)" -y kill-pane

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'opencode btop'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

set -g @dracula-plugins "cwd cpu-usage ram-usage continuum"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override dracula scripts with WSL-aware versions (must run after TPM)
if-shell 'uname -r | grep -qi microsoft' \
  'run "ln -sf ~/.tmux/scripts/cpu_info.sh ~/.tmux/plugins/tmux/scripts/cpu_info.sh; ln -sf ~/.tmux/scripts/ram_info.sh ~/.tmux/plugins/tmux/scripts/ram_info.sh"'

# Override window format to show pane count
setw -g window-status-current-format "#[fg=#f8f8f2]#[bg=#6272a4] #I #W(#{window_panes})#F "
setw -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #I #W(#{window_panes})"
