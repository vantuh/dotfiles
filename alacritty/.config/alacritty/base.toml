# Theme - Dracula
[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"

[colors.cursor]
text = "#44475a"
cursor = "#f8f8f2"

[colors.selection]
text = "#f8f8f2"
background = "#44475a"

[colors.normal]
black   = "#21222c"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#f8f8f2"

[colors.bright]
black   = "#6272a4"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#d6acff"
magenta = "#ff92df"
cyan    = "#a4ffff"
white   = "#ffffff"

[font.normal]
family = "JetBrainsMono Nerd Font"

[window]
padding = { x = 8, y = 8 }
option_as_alt = "Both"
startup_mode = "Windowed"
dimensions = { columns = 160, lines = 45 }

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "М", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "С", mods = "Control|Shift", action = "Copy" },
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" }
]
