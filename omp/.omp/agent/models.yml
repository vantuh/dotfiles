# OMP custom models — managed in dotfiles, stowed to ~/.omp/agent/models.yml
# Mirrors the `local` OpenAI-compatible llama.cpp provider from ~/.pi/agent/models.json.
# Only reachable while the local server on :8080 is running (see scripts/llama-update).

providers:
  local:
    baseUrl: http://localhost:8080/v1
    api: openai-completions
    apiKey: local
    compat:
      supportsDeveloperRole: true
      supportsReasoningEffort: false
    models:
      - id: qwen3.6-27b
        name: Qwen 3.6 27B (local)
        reasoning: true
        input: [text]
        contextWindow: 100000
        maxTokens: 32768
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      - id: gemma-4-26b
        name: Gemma 4 26B A4B QAT (local)
        reasoning: true
        input: [text]
        contextWindow: 196608
        maxTokens: 32768
        compat:
          supportsDeveloperRole: false
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }

      - id: qwythos-9b-v2-mtp
        name: Qwythos 9B v2 MTP (local)
        reasoning: true
        input: [text]
        contextWindow: 160000
        maxTokens: 32768
        compat:
          supportsDeveloperRole: false
          thinkingFormat: qwen-chat-template
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
